<!DOCTYPE html>
<html>
<head>

<title>Administração</title>

<style>

body{
  font-family:sans-serif;
  background:#f5f5f5;
  padding:30px;
  text-align:center;
}

.box{
  background:white;
  max-width:550px;
  margin:20px auto;
  padding:25px;
  border-radius:14px;
  box-shadow:0 2px 12px rgba(0,0,0,0.1);
}

button{
  width:100%;
  padding:16px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}

.report{
  background:#1976d2;
  color:white;
}

.reset{
  background:#d32f2f;
  color:white;
}

.export{
  background:#388e3c;
  color:white;
}

.activate{
  background:#f57c00;
  color:white;
}

</style>

</head>

<body>

<h1>⚙️ Administração</h1>


<!-- EVT -->

<div class="box">

<h2>🎟️ Race Ready</h2>

<button
class="report"
onclick="acao('relatorio_evt')">

📊 Relatório EVT

</button>

<button
class="export"
onclick="downloadCSV('csv_evt')">

⬇️ Export CSV EVT

</button>

<button
class="export"
onclick="downloadExcel('excel_evt')">

⬇️ Export Excel EVT

</button>

<button
class="reset"
onclick="acao('reset_evt')">

♻️ Reset EVT

</button>

</div>


<!-- VIP -->

<div class="box">

<h2>👑 VIP</h2>

<button
class="activate"
onclick="acao('gerar_rsprom')">

🔄 Gerar RSprom

</button>
</button>

<button
class="report"
onclick="acao('relatorio_vip')">

<button
class="activate"
onclick="acao('reativar_boss')">

👑 Reativar BOSS

</button>
  
📊 Relatório VIP

</button>

<button
class="export"
onclick="downloadCSV('csv_vip')">

⬇️ Export CSV VIP

</button>

<button
class="export"
onclick="downloadExcel('excel_vip')">

⬇️ Export Excel VIP

</button>

<button
class="reset"
onclick="acao('reset_vip')">

♻️ Reset VIP

</button>

</div>


<!-- RSC -->

<div class="box">

<h2>🏁 RSC</h2>

<button
class="activate"
onclick="acao('ativar_rsc')">

🔥 Ativar Todos RSC

</button>

<button
class="report"
onclick="acao('relatorio_rsc')">

📊 Relatório RSC

</button>

<button
class="export"
onclick="downloadCSV('csv_rsc')">

⬇️ Export CSV RSC

</button>

<button
class="export"
onclick="downloadExcel('excel_rsc')">

⬇️ Export Excel RSC

</button>

<button
class="reset"
onclick="acao('reset_rsc')">

♻️ Reset RSC

</button>

  <button
class="reset"
onclick="acao('desativar_rsc_unused')">

❌ Desativar RSC Não Usados Ainda

</button>

</div>


<button
onclick="window.location='/'"
style="
background:#222;
color:white;
max-width:550px;
"
>

⬅️ Voltar

</button>


<script>

async function acao(tipo){

  const key =
    prompt("Password Admin");

  if(!key) return;

  const res =
    await fetch(

      "/api/admin/" +
      tipo +
      "?key=" +
      key
    );

  const data =
    await res.json();

  alert(data.message);
}


function downloadCSV(tipo){

  const key =
    prompt("Password Admin");

  if(!key) return;

  window.location =

    "/api/export/" +
    tipo +
    "?key=" +
    key;
}


function downloadExcel(tipo){

  const key =
    prompt("Password Admin");

  if(!key) return;

  window.location =

    "/api/excel/" +
    tipo +
    "?key=" +
    key;
}

</script>

</body>
</html>
