<!DOCTYPE html>
<html>
<head>
  <title>Administração</title>
</head>

<body style="font-family:sans-serif;text-align:center;background:#f5f5f5;">

<h1>⚙️ Administração</h1>

<hr>

<h2>🎟️ EVT Gestão</h2>

<button onclick="acao('relatorio_evt')">
Criar Relatório EVT
</button>

<button onclick="acao('reset_evt')">
Reset EVT
</button>

<hr>

<h2>🎫 RSprom + 👑 BOSS Gestão</h2>

<button onclick="acao('relatorio_vip')">
Criar Relatório VIP
</button>

<button onclick="acao('reset_vip')">
Reset VIP
</button>

<hr>

<h2>🏁 RSC Gestão</h2>

<button onclick="acao('relatorio_rsc')">
Criar Relatório RSC
</button>

<button onclick="acao('reset_rsc')">
Reset RSC
</button>

<hr>

<h2 id="result"></h2>

<script>
async function acao(tipo) {

  const res = await fetch('/api/admin/' + tipo);

  const data = await res.json();

  document.getElementById('result').innerHTML = data.message;
}
</script>

</body>
</html>
