<!DOCTYPE html>
<html lang="pt">
<head>

  <meta charset="UTF-8">

  <title>Ticket System</title>

  <style>

    body{
      margin:0;
      background:#f5f5f5;
      font-family:sans-serif;

      display:flex;
      justify-content:center;
      align-items:center;

      height:100vh;
    }

    .box{

      background:white;

      width:350px;

      padding:40px;

      border-radius:20px;

      box-shadow:0 2px 15px rgba(0,0,0,0.1);

      text-align:center;
    }

    input{

      width:100%;

      padding:15px;

      margin-top:15px;

      border-radius:10px;

      border:1px solid #ccc;

      font-size:16px;

      box-sizing:border-box;
    }

    button{

      width:100%;

      padding:16px;

      margin-top:15px;

      border:none;

      border-radius:10px;

      font-size:18px;

      cursor:pointer;
    }

    .scanner{
      background:#1976d2;
      color:white;
    }

    .ativar{
      background:#f57c00;
      color:white;
    }

    .admin{
      background:#333;
      color:white;
    }

    h1{
      margin-bottom:30px;
    }

    #msg{
      margin-top:20px;
      color:red;
      font-weight:bold;
    }

  </style>
</head>

<body>

<div class="box">

  <h1>🎟️ Ticket System</h1>

  <input
    id="user"
    placeholder="Utilizador"
  >

  <input
    id="pass"
    type="password"
    placeholder="Password"
  >

  <button
    class="scanner"
    onclick="login('scanner')">

    📷 Scanner
  </button>

  <button
    class="ativar"
    onclick="login('ativar')">

    📦 Ativar
  </button>

  <button
    class="admin"
    onclick="admin()">

    ⚙️ Administração
  </button>

  <div id="msg"></div>

</div>


<script>

async function login(tipo){

  const username =
    document.getElementById("user").value;

  const password =
    document.getElementById("pass").value;

  const res = await fetch("/login",{

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({
      username,
      password
    })
  });

  const data = await res.json();

  if(data.success){

    if(tipo === "scanner"){
      window.location = "/scanner.html";
    }

    if(tipo === "ativar"){
      window.location = "/ativar.html";
    }

  }

  else{

    document.getElementById("msg")
    .innerHTML = "Login inválido";
  }
}


function admin(){

  const pass =
    prompt("Password Admin");

  if(pass === "admin2468"){

    window.location =
      "/admin.html";
  }

  else{

    alert("Password errada");
  }
}

</script>

</body>
</html>
