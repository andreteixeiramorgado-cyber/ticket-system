<!DOCTYPE html>
<html lang="pt">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body{
      margin:0;
      background:#f5f5f5;
      font-family:sans-serif;

      display:flex;
      justify-content:center;
      align-items:center;

      min-height:100vh;
    }

    .box{

      background:white;

      width:90%;
      max-width:450px;

      padding:35px;

      border-radius:20px;

      box-shadow:0 2px 15px rgba(0,0,0,0.1);

      text-align:center;
    }

    h1{
      margin-bottom:25px;
    }

    #reader{
      width:100%;
      margin:auto;
    }

    button{

      width:100%;

      padding:16px;

      margin-top:15px;

      border:none;

      border-radius:10px;

      font-size:18px;

      cursor:pointer;

      color:white;
    }

    .orange{
      background:#f57c00;
    }

    .dark{
      background:#333;
    }

    #result{

      margin-top:25px;

      font-size:28px;

      font-weight:bold;
    }

    #stats{

      margin-top:30px;

      background:#f0f0f0;

      padding:20px;

      border-radius:15px;

      font-size:18px;
    }

    .line{
      margin-top:10px;
    }

  </style>

</head>

<body>

<div class="box">

  <h1>📷 Scanner Check-in</h1>

  <div id="reader"></div>

  <div id="result">

    Aguardando scan...

  </div>


  <!-- STATS -->
  <div id="stats">

    <div class="line">

      🎟️ Entradas:
      <span id="total">0</span>

    </div>

    <div class="line">

      🔥 Último:
      <span id="ultimo">-</span>

    </div>

  </div>


  <!-- BOTÕES -->
  <button
    class="orange"
    onclick="window.location='/ativar.html'"
  >

    📦 Ir para Ativar

  </button>

  <button
    class="dark"
    onclick="window.location='/dashboard.html'"
  >

    📊 Dashboard

  </button>

</div>


<script>

// ======================================================
// VARS
// ======================================================

const resultEl =
  document.getElementById("result");

const totalEl =
  document.getElementById("total");

const ultimoEl =
  document.getElementById("ultimo");

let total = 0;

let scanning = true;


// ======================================================
// VALIDAR QR
// ======================================================

async function validarQR(texto){

  try{

    const id =
      texto.split("/t/")[1];

    if(!id){

      resultEl.innerHTML =
        "⚠️ QR inválido";

      resultEl.style.color =
        "red";

      return;
    }

    const res =
      await fetch("/api/check/" + id);

    const data =
      await res.json();


    // VALID
    if(data.status === "valid"){

      total++;

      totalEl.innerHTML =
        total;

      ultimoEl.innerHTML =
        id;

      resultEl.innerHTML =
        "✅ Entrada válida";

      resultEl.style.color =
        "green";
    }


    // USED
    else if(data.status === "used"){

      resultEl.innerHTML =
        "❌ Já utilizado";

      resultEl.style.color =
        "red";
    }


    // LIMIT
    else if(data.status === "limit"){

      resultEl.innerHTML =
        "⛔ Limite atingido";

      resultEl.style.color =
        "red";
    }


    // NOT ACTIVE
    else if(data.status === "not_active"){

      resultEl.innerHTML =
        "🟡 Não ativado";

      resultEl.style.color =
        "orange";
    }


    // INVALID
    else{

      resultEl.innerHTML =
        "⚠️ Inválido";

      resultEl.style.color =
        "red";
    }


    // ======================================================
    // DELAY
    // ======================================================

    scanning = false;


    // mostrar espera após 3s
    setTimeout(()=>{

      resultEl.innerHTML =
        "⌛ Aguarde 2 segundos...";

      resultEl.style.color =
        "black";

    },3000);


    // reset total após 5s
    setTimeout(()=>{

      scanning = true;

      resultEl.innerHTML =
        "Aguardando scan...";

      resultEl.style.color =
        "black";

    },5000);

  }

  catch(err){

    console.error(err);

    resultEl.innerHTML =
      "Erro validação";

    resultEl.style.color =
      "red";
  }
}


// ======================================================
// SCAN SUCCESS
// ======================================================

function onScanSuccess(decodedText){

  if(!scanning) return;

  validarQR(decodedText);
}


// ======================================================
// START SCANNER
// ======================================================

function startScanner(){

  const html5QrCode =
    new Html5Qrcode("reader");

  html5QrCode.start(

    { facingMode:"environment" },

    {
      fps:10,

      qrbox:{
        width:250,
        height:250
      }
    },

    onScanSuccess

  )

  .catch(err=>{

    console.error(err);

    resultEl.innerHTML =
      "Erro câmara";
  });
}


// ======================================================
// CAMERA
// ======================================================

navigator.mediaDevices
.getUserMedia({ video:true })

.then(stream=>{

  stream.getTracks()
  .forEach(track=>track.stop());

  startScanner();
})

.catch(err=>{

  console.error(err);

  resultEl.innerHTML =
    "Permissão negada";
});

</script>

</body>
</html>
