<!DOCTYPE html>
<html lang="pt">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body{
      margin:0;
      background:#f5f5f5;
      font-family:sans-serif;

      display:flex;
      justify-content:center;
      align-items:center;

      min-height:100vh;
    }

    .box{

      background:white;

      width:90%;
      max-width:450px;

      padding:35px;

      border-radius:20px;

      box-shadow:0 2px 15px rgba(0,0,0,0.1);

      text-align:center;
    }

    h1{
      margin-bottom:25px;
    }

    #reader{
      width:100%;
      margin:auto;
    }

    button{

      width:100%;

      padding:16px;

      margin-top:15px;

      border:none;

      border-radius:10px;

      font-size:18px;

      cursor:pointer;

      color:white;
    }

    .orange{
      background:#f57c00;
    }

    .dark{
      background:#333;
    }

    #result{

      margin-top:25px;

      font-size:28px;

      font-weight:bold;
    }

    #stats{

      margin-top:30px;

      background:#f0f0f0;

      padding:20px;

      border-radius:15px;

      font-size:22px;
    }

  </style>

</head>

<body>

<div class="box">

  <h1 id="titulo">

    📷 Scanner

  </h1>

  <div id="reader"></div>

  <div id="result">

    Aguardando scan...

  </div>

  <!-- LEITOR USB -->

<input

id="usbReader"

type="text"

autocomplete="off"

autocapitalize="off"

spellcheck="false"

style="

position:absolute;

left:-9999px;

opacity:0;

"

>

  <!-- STATS -->
  <div id="stats">

    <span id="statsText">

      Entradas: 0

    </span>

  </div>


  <!-- BOTÕES -->
  <button
    class="orange"
    onclick="window.location='/ativar.html'"
  >

    📦 Ir para Ativar

  </button>

  <button
    class="dark"
    onclick="window.location='/dashboard.html'"
  >

    📊 Dashboard

  </button>

  <button
class="orange"
onclick="window.location='/scanner-admin.html'"
>

🔧 Controlo Refeições Anteriores

</button>

</div>


<script>

// ======================================================
// GRUPO
// ======================================================

let grupo = null;

let refeicao = null;

let modo = null;

// ======================================================
// ESCOLHER GRUPO
// ======================================================

const escolha = prompt(

`Selecionar Grupo:

1 = Race Ready
2 = Rally Series
3 = Odissiea`

);

// ======================================================
// MODO DE LEITURA
// ======================================================

const modoEscolha = prompt(

`Modo de leitura:

1 = Câmara
2 = Leitor QR USB`

);

if(modoEscolha === "2"){

  modo = "usb";

}else{

  modo = "camera";

}
  
// ======================================================
// RACE READY
// ======================================================

if(escolha === "1"){

  grupo = "evt";

  document.getElementById("titulo")
  .innerHTML =
    "🎟️ Scanner Race Ready";


  const ref = prompt(

`Selecionar Refeição:

1 = Dia 1 Almoço
2 = Dia 1 Jantar
3 = Dia 2 Almoço
4 = Dia 2 Jantar
5 = Dia 3 Almoço`

  );


  if(ref === "1"){

    refeicao =
      "dia1_almoco";
  }

  else if(ref === "2"){

    refeicao =
      "dia1_jantar";
  }

  else if(ref === "3"){

    refeicao =
      "dia2_almoco";
  }

  else if(ref === "4"){

    refeicao =
      "dia2_jantar";
  }

  else{

    refeicao =
      "dia3_almoco";
  }
}


// ======================================================
// RALLY SERIES
// ======================================================

else{

  grupo = "rally";

  document.getElementById("titulo")
  .innerHTML =
    "🏁 Scanner Rally Series";


  const ref = prompt(

`Selecionar Refeição:

1 = Dia 1 Almoço
2 = Dia 1 Jantar
3 = Dia 2 Almoço
4 = Dia 2 Jantar
5 = Dia 3 Almoço`

);


 if(ref === "1"){

  refeicao =
    "dia1_almoco";
}

else if(ref === "2"){

  refeicao =
    "dia1_jantar";
}

else if(ref === "3"){

  refeicao =
    "dia2_almoco";
}

else if(ref === "4"){

  refeicao =
    "dia2_jantar";
}

else{

  refeicao =
    "dia3_almoco";
}
}

  
// ======================================================
// ODS
// ======================================================

if(escolha === "3"){

  grupo = "ods";

  document.getElementById("titulo")
  .innerHTML =
    "🎟️ Scanner Odisseia";


  const ref = prompt(

`Selecionar Refeição:

1 = Dia 1 Almoço
2 = Dia 1 Jantar
3 = Dia 2 Almoço
4 = Dia 2 Jantar
5 = Dia 3 Almoço
6 = Dia 3 Jantar
7 = Dia 4 Almoço
8 = Dia 4 Jantar`

  );


  if(ref === "1"){

    refeicao =
      "dia1_almoco";
  }

  else if(ref === "2"){

    refeicao =
      "dia1_jantar";
  }

  else if(ref === "3"){

    refeicao =
      "dia2_almoco";
  }

  else if(ref === "4"){

    refeicao =
      "dia2_jantar";
  }

  else if(ref === "5"){

    refeicao =
      "dia3_almoco";
  }
    else if(ref === "6"){

    refeicao =
      "dia3_jantar";
  }
      
  else if(ref === "7"){

    refeicao =
      "dia4_almoco";
  }
  else{

    refeicao =
      "dia4_jantar";
  }
}

  
// ======================================================
// VARS
// ======================================================

const resultEl =
  document.getElementById("result");

let scanning = true;


// ======================================================
// MOSTRAR MODO
// ======================================================

if(modo === "usb"){

  resultEl.innerHTML =

    "⌨️ MODO LEITOR USB<br><br>Aguardando leitura...";

}else{

  resultEl.innerHTML =

    "📷 MODO CÂMARA<br><br>Aguardando scan...";

}
  
// ======================================================
// LOAD STATS
// ======================================================

async function loadStats(){

  try{

    const res =
      await fetch(

        "/api/stats/" +
        grupo +
        "/" +
        refeicao
      );

    const data =
      await res.json();


    // ======================================================
    // EVT
    // ======================================================

    if(grupo === "evt"){

      document.getElementById("statsText")
      .innerHTML =

        "🎟️ Race Ready<br><br>" +

        refeicao
        .replaceAll("_"," ") +

        "<br><br>" +

        "Entradas: " +
        data.total;
    }


    // ======================================================
    // RALLY
    // ======================================================

    else{

      document.getElementById("statsText")
      .innerHTML =

        "🏁 Rally Series<br><br>" +

        refeicao
        .replaceAll("_"," ") +

        "<br><br>" +

        "Entradas: " +
        data.total;
    }
    // ======================================================
    // ods
    // ======================================================

    if(grupo === "ods"){

      document.getElementById("statsText")
      .innerHTML =

        "🎟️ Odissiea Hospitality<br><br>" +

        refeicao
        .replaceAll("_"," ") +

        "<br><br>" +

        "Entradas: " +
        data.total;
    }
    
  }

  catch(err){

    console.error(err);
  }
}

   
// ======================================================
// VALIDAR QR
// ======================================================

async function validarQR(texto){

  try{

   let id;

if (texto.includes("/t/")) {

    id = texto.split("/t/")[1];

} else {

    id = texto.trim();

}

    if(!id){

      resultEl.innerHTML =
        "⚠️ QR inválido";

      resultEl.style.color =
        "red";

      return;
    }


    // ======================================================
    // FILTRO EVT
    // ======================================================

    if(
      grupo === "evt" &&
      !id.includes("EVT")
    ){

      resultEl.innerHTML =
        "❌ Não pertence Race Ready";

      resultEl.style.color =
        "red";

      return;
    }


    // ======================================================
    // FILTRO RALLY
    // ======================================================

    if(
      grupo === "rally" &&
      !(
        id.includes("RSprom") ||
        id.includes("BOSS") ||
        id.includes("RSC") ||
        id.includes("CAL")
      )
    ){

      resultEl.innerHTML =
        "❌ Não pertence Rally";

      resultEl.style.color =
        "red";

      return;
    }


    // ======================================================
    // FILTRO ODS
    // ======================================================

    if(
      grupo === "ods" &&
      !id.includes("ODS") ||
        id.includes("CAL")
    ){

      resultEl.innerHTML =
        "❌ Não pertence Odisseia";

      resultEl.style.color =
        "red";

      return;
    }


    const res =
      await fetch(

        "/api/check/" +
        id +
        "?refeicao=" +
        refeicao
      );

    const data =
      await res.json();


   // VALID

  if(data.status === "valid"){

let lista = "";

const todas = [

["dia1_almoco","Dia 1 Almoço"],

["dia1_jantar","Dia 1 Jantar"],

["dia2_almoco","Dia 2 Almoço"],

["dia2_jantar","Dia 2 Jantar"],

["dia3_almoco","Dia 3 Almoço"]

];

// Apenas ODS tem refeições extra

if(grupo === "ods"){

    todas.push(

        ["dia3_jantar","Dia 3 Jantar"],

        ["dia4_almoco","Dia 4 Almoço"],

        ["dia4_jantar","Dia 4 Jantar"]

    );

}

todas.forEach(r=>{

    if(data.refeicoes.includes(r[0])){

        lista += "🟢 " + r[1] + "<br>";

    }else{

        lista += "⚪ " + r[1] + "<br>";

    }

});

  resultEl.innerHTML =

  `
  <div style="color:green;font-size:30px;font-weight:bold;line-height:1.3;">

  BEM VINDO!!!<br>

  YOU ARE WELCOME!!!<br>

  BIEN VENIDO!!!

  </div>

  <br>

  <div style="font-size:24px;font-weight:bold;color:black;">

  👤 ${data.cliente}

  </div>

  <br>

  <div style="font-size:22px;color:black;">

  🍽️ ${data.usadas}/${data.total} refeições

  </div>

  <br>

  <div style="text-align:left;font-size:18px;color:black;">

  ${lista}

  </div>
  `;

  resultEl.style.color="green";

  loadStats();

}

// USED
else if(data.status === "used"){

  resultEl.innerHTML =
    "❌ Já utilizado";

  resultEl.style.color =
    "red";
}


// LIMIT
else if(data.status === "limit"){

  resultEl.innerHTML =
    "⛔ Limite atingido";

  resultEl.style.color =
    "red";
}


// NOT ACTIVE
else if(data.status === "not_active"){

  resultEl.innerHTML =
    "🟡 Não ativado";

  resultEl.style.color =
    "orange";
}

// NOVO
else if(data.status === "meal_used"){

  resultEl.innerHTML =
    "❌ Refeição já utilizada";

  resultEl.style.color =
    "red";
}


// NOVO
else if(data.status === "wait_4_hours"){

  resultEl.innerHTML =
    "⏳ Aguarde 4 horas";

  resultEl.style.color =
    "orange";
}


// INVALID
else{

  resultEl.innerHTML =
    "⚠️ Inválido";

  resultEl.style.color =
    "red";
}

    // bloquear imediato
    scanning = false;


    // 3 segundos
    setTimeout(()=>{

      resultEl.innerHTML =
        "⌛ Aguarde 2 segundos...";

      resultEl.style.color =
        "black";

    },3000);


    // reset
    setTimeout(()=>{

      scanning = true;

      resultEl.innerHTML =
        "Aguardando scan...";

      resultEl.style.color =
        "black";

    },5000);

  }

  catch(err){

    console.error(err);

    resultEl.innerHTML =
      "Erro validação";

    resultEl.style.color =
      "red";
  }
}


// ======================================================
// SCAN SUCCESS
// ======================================================

function onScanSuccess(decodedText){

  if(!scanning) return;

  scanning = false;

  validarQR(decodedText);
}

 // ======================================================
// LEITOR USB
// ======================================================

if(modo === "usb"){

  const usbReader =
    document.getElementById("usbReader");

  usbReader.focus();

  setInterval(()=>{

    usbReader.focus();

},1000);

  document.addEventListener("click",()=>{

    usbReader.focus();

  });

  usbReader.addEventListener("keydown",function(e){

    if(e.key !== "Enter")
      return;

    e.preventDefault();

    const codigo =
      usbReader.value.trim();

    usbReader.value="";

    usbReader.focus();

    if(codigo){

      validarQR(codigo);

    }

  });

} 

// ======================================================
// START
// ======================================================

function startScanner(){

  const html5QrCode =
    new Html5Qrcode("reader");

  html5QrCode.start(

    { facingMode:"environment" },

    {
      fps:10,

      qrbox:{
        width:250,
        height:250
      }
    },

    onScanSuccess

  )

  .catch(err=>{

    console.error(err);

    resultEl.innerHTML =
      "Erro câmara";
  });
}


// ======================================================
// CAMERA
// ======================================================

// ======================================================
// INICIAR
// ======================================================

if(modo === "camera"){

  navigator.mediaDevices
  .getUserMedia({ video:true })

  .then(stream=>{

    stream.getTracks()
    .forEach(track=>track.stop());

    startScanner();

    loadStats();

  })

  .catch(err=>{

    console.error(err);

    resultEl.innerHTML =
      "Permissão negada";

  });

}else{

  loadStats();

}

// ======================================================
// AUMENTAR REFEIÇÕES
// ======================================================

    const ticket = prompt(

        "Número do ticket\n\nEx: ODS-ABC12345"

    );

    if(!ticket) return;

    const quantidade = prompt(

        "Quantas refeições pretende adicionar?"

    );

    if(!quantidade) return;

    const password = prompt(

        "Password de Administrador"

    );

    if(!password) return;

  // ======================================================
// AUMENTAR REFEIÇÕES
// ======================================================

app.post(

"/api/add-meals",

checkAuth,

async(req,res)=>{

try{

const{

ticket,

quantidade,

password

}=req.body;

// PASSWORD ADMIN

if(password!=="ADMIN123"){

return res.json({

success:false,

message:"Password inválida"

});

}

const docRef=

db.collection("tickets").doc(ticket);

// ======================================================
// SUBSTITUIR TICKET
// ======================================================

async function substituirTicket(){

    const antigo = prompt(

        "Ticket ANTIGO\n\nEx: ODS-ABC12345"

    );

    if(!antigo) return;

    const novo = prompt(

        "Ticket NOVO\n\nEx: ODS-ZYX98765"

    );

    if(!novo) return;

    const password = prompt(

        "Password Administrador"

    );

    if(!password) return;

    const confirmar = confirm(

        "Confirma substituir:\n\n" +

        antigo +

        "\n\npor\n\n" +

        novo + " ?"

    );

    if(!confirmar) return;

   const res = await fetch(

    "/api/replace-ticket",

    {

        method:"POST",

        headers:{

            "Content-Type":"application/json"

        },

        body:JSON.stringify({

            antigo,

            novo,

            password

        })

    }

);

const data = await res.json();

if(data.success){

    alert(

        "✅ Ticket substituído com sucesso."

    );

}else{

    alert(

        "❌ " +

        data.message

    );

}

}

  <hr style="margin-top:50px;">

<h2>🔧 Ferramentas de Administração</h2>

<button
id="btnExtra"

onclick="aumentarRefeicoes()"

style="
padding:15px 25px;
font-size:22px;
margin-top:15px;
">

➕ Aumentar refeições

</button>

<br><br>

<button
id="btnClone"

onclick="substituirTicket()"

style="
padding:15px 25px;
font-size:22px;
">

🔄 Substituir Ticket

</button>

  
</script>
</body>
</html>
