<!DOCTYPE html>
<html>
<head>
  <title>Scanner Check-in</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body style="text-align:center;font-family:sans-serif;">
  <h2>📷 Scanner de Bilhetes</h2>

  <div id="reader" style="width:300px;margin:auto;"></div>
  <h1 id="result">Aguardando scan...</h1>

  <script>
    async function validarQR(texto) {
      try {
        // extrair ID do link
        const id = texto.split("/t/")[1];

        const res = await fetch(`/api/check/${id}`);
        const data = await res.json();

        const el = document.getElementById("result");

        if (data.status === "valid") {
          el.innerHTML = "✅ Entrada válida";
          el.style.color = "green";
        } else if (data.status === "used") {
          el.innerHTML = "❌ Já utilizado";
          el.style.color = "red";
        } else {
          el.innerHTML = "⚠️ Inválido";
          el.style.color = "black";
        }

      } catch (err) {
        console.error(err);
      }
    }

    function onScanSuccess(decodedText) {
      validarQR(decodedText);
    }
function startScanner() {
  const html5QrCode = new Html5Qrcode("reader");

  html5QrCode.start(
    { facingMode: "environment" }, // 🔥 força câmara traseira
    {
      fps: 10,
      qrbox: { width: 250, height: 250 }
    },
    onScanSuccess
  ).catch(err => {
    console.error(err);
    document.getElementById("result").innerHTML = "Erro na câmara";
  });
}

navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => {
    stream.getTracks().forEach(track => track.stop());
    startScanner();
  })
  .catch(err => {
    console.error(err);
    document.getElementById("result").innerHTML = "Permissão negada";
  });

  </script>
</body>
</html>
