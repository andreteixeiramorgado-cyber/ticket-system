<!DOCTYPE html>
<html lang="pt">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body{
      margin:0;
      background:#f5f5f5;
      font-family:sans-serif;

      display:flex;
      justify-content:center;
      align-items:center;

      min-height:100vh;
    }

    .box{

      background:white;

      width:90%;
      max-width:450px;

      padding:35px;

      border-radius:20px;

      box-shadow:0 2px 15px rgba(0,0,0,0.1);

      text-align:center;
    }

    h1{
      margin-bottom:25px;
    }

    #reader{
      width:100%;
      margin:auto;
    }

    button{

      width:100%;

      padding:16px;

      margin-top:15px;

      border:none;

      border-radius:10px;

      font-size:18px;

      cursor:pointer;

      color:white;
    }

    .orange{
      background:#f57c00;
    }

    .dark{
      background:#333;
    }

    #result{

      margin-top:25px;

      font-size:28px;

      font-weight:bold;
    }

    #stats{

      margin-top:30px;

      background:#f0f0f0;

      padding:20px;

      border-radius:15px;

      font-size:22px;
    }

  </style>

</head>

<body>

<div class="box">

  <h1 id="titulo">

    📷 Scanner

  </h1>

  <div id="reader"></div>

  <div id="result">

    Aguardando scan...

  </div>


  <!-- STATS -->
  <div id="stats">

    <span id="statsText">

      Entradas: 0

    </span>

  </div>


  <!-- BOTÕES -->
  <button
    class="orange"
    onclick="window.location='/ativar.html'"
  >

    📦 Ir para Ativar

  </button>

  <button
    class="dark"
    onclick="window.location='/dashboard.html'"
  >

    📊 Dashboard

  </button>

</div>


<script>

// ======================================================
// GRUPO
// ======================================================

let grupo = null;

let refeicao = null;


// ======================================================
// ESCOLHER GRUPO
// ======================================================

const escolha = prompt(

`Selecionar Grupo:

1 = Race Ready
2 = Rally Series`

);


// ======================================================
// RACE READY
// ======================================================

if(escolha === "1"){

  grupo = "evt";

  document.getElementById("titulo")
  .innerHTML =
    "🎟️ Scanner Race Ready";


  const ref = prompt(

`Selecionar Refeição:

1 = Dia 1 Almoço
2 = Dia 1 Jantar
3 = Dia 2 Almoço
4 = Dia 2 Jantar
5 = Dia 3 Almoço`

  );


  if(ref === "1"){

    refeicao =
      "dia1_almoco";
  }

  else if(ref === "2"){

    refeicao =
      "dia1_jantar";
  }

  else if(ref === "3"){

    refeicao =
      "dia2_almoco";
  }

  else if(ref === "4"){

    refeicao =
      "dia2_jantar";
  }

  else{

    refeicao =
      "dia3_almoco";
  }
}


// ======================================================
// RALLY SERIES
// ======================================================

else{

  grupo = "rally";

  document.getElementById("titulo")
  .innerHTML =
    "🏁 Scanner Rally Series";


  const ref = prompt(

`Selecionar Refeição:

1 = Dia 1 Almoço
2 = Dia 1 Jantar
3 = Dia 2 Almoço
4 = Dia 2 Jantar
5 = Dia 3 Almoço`

);


 if(ref === "1"){

  refeicao =
    "dia1_almoco";
}

else if(ref === "2"){

  refeicao =
    "dia1_jantar";
}

else if(ref === "3"){

  refeicao =
    "dia2_almoco";
}

else if(ref === "4"){

  refeicao =
    "dia2_jantar";
}

else{

  refeicao =
    "dia3_almoco";
}
}
  
// ======================================================
// VARS
// ======================================================

const resultEl =
  document.getElementById("result");

let scanning = true;


// ======================================================
// LOAD STATS
// ======================================================

async function loadStats(){

  try{

    const res =
      await fetch(

        "/api/stats/" +
        grupo +
        "/" +
        refeicao
      );

    const data =
      await res.json();


    // ======================================================
    // EVT
    // ======================================================

    if(grupo === "evt"){

      document.getElementById("statsText")
      .innerHTML =

        "🎟️ Race Ready<br><br>" +

        refeicao
        .replaceAll("_"," ") +

        "<br><br>" +

        "Entradas: " +
        data.total;
    }


    // ======================================================
    // RALLY
    // ======================================================

    else{

      document.getElementById("statsText")
      .innerHTML =

        "🏁 Rally Series<br><br>" +

        refeicao
        .replaceAll("_"," ") +

        "<br><br>" +

        "Entradas: " +
        data.total;
    }

  }

  catch(err){

    console.error(err);
  }
}


// ======================================================
// VALIDAR QR
// ======================================================

async function validarQR(texto){

  try{

    const id =
      texto.split("/t/")[1];

    if(!id){

      resultEl.innerHTML =
        "⚠️ QR inválido";

      resultEl.style.color =
        "red";

      return;
    }


    // ======================================================
    // FILTRO EVT
    // ======================================================

    if(
      grupo === "evt" &&
      !id.includes("EVT")
    ){

      resultEl.innerHTML =
        "❌ Não pertence Race Ready";

      resultEl.style.color =
        "red";

      return;
    }


    // ======================================================
    // FILTRO RALLY
    // ======================================================

    if(
      grupo === "rally" &&
      !(
        id.includes("RSprom") ||
        id.includes("BOSS") ||
        id.includes("RSC")
      )
    ){

      resultEl.innerHTML =
        "❌ Não pertence Rally";

      resultEl.style.color =
        "red";

      return;
    }


    const res =
      await fetch(

        "/api/check/" +
        id +
        "?refeicao=" +
        refeicao
      );

    const data =
      await res.json();


   // VALID
if(data.status === "valid"){

  resultEl.innerHTML =
    "✅ Entrada válida";

  resultEl.style.color =
    "green";

  loadStats();
}


// USED
else if(data.status === "used"){

  resultEl.innerHTML =
    "❌ Já utilizado";

  resultEl.style.color =
    "red";
}


// LIMIT
else if(data.status === "limit"){

  resultEl.innerHTML =
    "⛔ Limite atingido";

  resultEl.style.color =
    "red";
}


// NOT ACTIVE
else if(data.status === "not_active"){

  resultEl.innerHTML =
    "🟡 Não ativado";

  resultEl.style.color =
    "orange";
}

// NOVO
else if(data.status === "meal_used"){

  resultEl.innerHTML =
    "❌ Refeição já utilizada";

  resultEl.style.color =
    "red";
}


// NOVO
else if(data.status === "wait_4_hours"){

  resultEl.innerHTML =
    "⏳ Aguarde 4 horas";

  resultEl.style.color =
    "orange";
}


// INVALID
else{

  resultEl.innerHTML =
    "⚠️ Inválido";

  resultEl.style.color =
    "red";
}

    // bloquear imediato
    scanning = false;


    // 3 segundos
    setTimeout(()=>{

      resultEl.innerHTML =
        "⌛ Aguarde 2 segundos...";

      resultEl.style.color =
        "black";

    },3000);


    // reset
    setTimeout(()=>{

      scanning = true;

      resultEl.innerHTML =
        "Aguardando scan...";

      resultEl.style.color =
        "black";

    },5000);

  }

  catch(err){

    console.error(err);

    resultEl.innerHTML =
      "Erro validação";

    resultEl.style.color =
      "red";
  }
}


// ======================================================
// SCAN SUCCESS
// ======================================================

function onScanSuccess(decodedText){

  if(!scanning) return;

  scanning = false;

  validarQR(decodedText);
}


// ======================================================
// START
// ======================================================

function startScanner(){

  const html5QrCode =
    new Html5Qrcode("reader");

  html5QrCode.start(

    { facingMode:"environment" },

    {
      fps:10,

      qrbox:{
        width:250,
        height:250
      }
    },

    onScanSuccess

  )

  .catch(err=>{

    console.error(err);

    resultEl.innerHTML =
      "Erro câmara";
  });
}


// ======================================================
// CAMERA
// ======================================================

navigator.mediaDevices
.getUserMedia({ video:true })

.then(stream=>{

  stream.getTracks()
  .forEach(track=>track.stop());

  startScanner();

  loadStats();

})

.catch(err=>{

  console.error(err);

  resultEl.innerHTML =
    "Permissão negada";
});

</script>

</body>
</html>
