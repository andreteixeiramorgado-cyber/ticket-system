<!DOCTYPE html>
<html>
<head>
  <title>Scanner Check-in</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body{
      text-align:center;
      font-family:sans-serif;
      background:#f5f5f5;
      margin:0;
      padding:30px;
    }

    h2{
      margin-bottom:20px;
    }

    #reader{
      width:320px;
      margin:auto;
      border-radius:12px;
      overflow:hidden;
    }

    #result{
      margin-top:25px;
      font-size:32px;
      font-weight:bold;
      min-height:80px;
    }

    .info{
      margin-top:10px;
      font-size:18px;
      color:#666;
    }

    .nav-btn{
      margin-top:20px;
      padding:14px 25px;
      border:none;
      border-radius:10px;
      background:#f57c00;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    #counter{
      margin-top:25px;
      font-size:22px;
      font-weight:bold;
      color:#1976d2;
    }

  </style>
</head>

<body>

<h2>📷 Scanner de Bilhetes</h2>

<div id="reader"></div>

<h1 id="result">
  Aguardando scan...
</h1>

<div class="info">
  Sistema de validação ativo
</div>

<div id="counter">
  Entradas hoje: 0
</div>

<button
  class="nav-btn"
  onclick="window.location='/ativar.html'">

  📦 Ir para Ativar

</button>

<script>

const resultEl = document.getElementById("result");

const counterEl = document.getElementById("counter");

let scanning = true;

let totalEntradas = 0;


// ======================================================
// VALIDAR QR
// ======================================================

async function validarQR(texto){

  try{

    const id = texto.split("/t/")[1];

    if(!id){

      resultEl.innerHTML = "⚠️ QR inválido";

      resultEl.style.color = "black";

      return;
    }

    const res =
      await fetch("/api/check/" + id);

    const data = await res.json();


    // ======================================================
    // VÁLIDO
    // ======================================================

    if(data.status === "valid"){

      totalEntradas++;

      counterEl.innerHTML =
        "Entradas hoje: " + totalEntradas;

      resultEl.innerHTML =
        "✅ Entrada válida";

      resultEl.style.color = "green";
    }


    // ======================================================
    // JÁ UTILIZADO
    // ======================================================

    else if(data.status === "used"){

      resultEl.innerHTML =
        "❌ Já utilizado";

      resultEl.style.color = "red";
    }


    // ======================================================
    // NÃO ATIVADO
    // ======================================================

    else if(data.status === "not_active"){

      resultEl.innerHTML =
        "🟡 Não ativado";

      resultEl.style.color = "orange";
    }


    // ======================================================
    // LIMITE
    // ======================================================

    else if(data.status === "limit"){

      resultEl.innerHTML =
        "⛔ Limite atingido";

      resultEl.style.color = "red";
    }


    // ======================================================
    // INVÁLIDO
    // ======================================================

    else{

      resultEl.innerHTML =
        "⚠️ Bilhete inválido";

      resultEl.style.color = "black";
    }


    // ======================================================
    // 3 SEGUNDOS RESULTADO
    // ======================================================

    setTimeout(() => {

      resultEl.innerHTML =
        "⏳ Aguarde 2 segundos...";

      resultEl.style.color = "gray";

    }, 3000);


    // ======================================================
    // 5 SEGUNDOS TOTAL
    // ======================================================

    setTimeout(() => {

      scanning = true;

      resultEl.innerHTML =
        "Aguardando scan...";

      resultEl.style.color = "black";

    }, 5000);

  }

  catch(err){

    console.error(err);

    resultEl.innerHTML =
      "Erro ao validar";

    resultEl.style.color = "red";

    scanning = true;
  }
}


// ======================================================
// SCAN SUCCESS
// ======================================================

function onScanSuccess(decodedText){

  if(!scanning) return;

  scanning = false;

  validarQR(decodedText);
}


// ======================================================
// START CAMERA
// ======================================================

function startScanner(){

  const html5QrCode =
    new Html5Qrcode("reader");

  html5QrCode.start(

    { facingMode: "environment" },

    {
      fps: 10,

      qrbox:{
        width:260,
        height:260
      }
    },

    onScanSuccess

  ).catch(err => {

    console.error(err);

    resultEl.innerHTML =
      "Erro ao abrir câmara";
  });
}


// ======================================================
// CAMERA PERMISSION
// ======================================================

navigator.mediaDevices.getUserMedia({
  video:true
})

.then(stream => {

  stream.getTracks().forEach(track =>
    track.stop()
  );

  startScanner();
})

.catch(err => {

  console.error(err);

  resultEl.innerHTML =
    "Permissão de câmara negada";
});

</script>

</body>
</html>
