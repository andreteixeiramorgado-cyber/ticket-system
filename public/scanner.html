<!DOCTYPE html>
<html>
<head>
  <title>Scanner Check-in</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body style="text-align:center;font-family:sans-serif;">
  <h2>📷 Scanner de Bilhetes</h2>

  <div id="reader" style="width:300px;margin:auto;"></div>
  <h1 id="result">Aguardando scan...</h1>

 <script>
  const resultEl = document.getElementById("result");
  let scanning = true;

  async function validarQR(texto) {
    try {
      const id = texto.split("/t/")[1];

      if (!id) {
        resultEl.innerHTML = "QR inválido";
        return;
      }

      const res = await fetch("/api/check/" + id);
      const data = await res.json();

      if (data.status === "valid") {
        resultEl.innerHTML = "✅ Entrada válida";
        resultEl.style.color = "green";
      } 
      else if (data.status === "used") {
        resultEl.innerHTML = "❌ Já utilizado";
        resultEl.style.color = "red";
      } 
      else if (data.status === "not_active") {
        resultEl.innerHTML = "🟡 Não ativado";
        resultEl.style.color = "orange";
      } 
      else {
        resultEl.innerHTML = "⚠️ Inválido";
      }

    } catch (err) {
      console.error(err);
      resultEl.innerHTML = "Erro ao validar";
    }
  }

  function onScanSuccess(decodedText) {
  if (!scanning) return;

  scanning = false;

  validarQR(decodedText);

  // mostrar que está bloqueado
  resultEl.innerHTML += "<br><small>A aguardar 5 segundos...</small>";

  setTimeout(() => {
    scanning = true;
    resultEl.innerHTML = "Aguardando scan...";
    resultEl.style.color = "black";
  }, 7500);
}

  function startScanner() {
    const html5QrCode = new Html5Qrcode("reader");

    html5QrCode.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },
      onScanSuccess
    ).catch(err => {
      console.error(err);
      resultEl.innerHTML = "Erro na câmara";
    });
  }

  navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => {
      stream.getTracks().forEach(track => track.stop());
      startScanner();
    })
    .catch(err => {
      console.error(err);
      resultEl.innerHTML = "Permissão negada";
    });
</script>
</body>
</html>
