<script>
  const resultEl = document.getElementById("result");

  async function validarQR(texto) {
    try {
      const id = texto.split("/t/")[1];

      const res = await fetch(`/api/check/${id}`);
      const data = await res.json();

      if (data.status === "valid") {
        resultEl.innerHTML = "✅ Entrada válida";
        resultEl.style.color = "green";
      } else if (data.status === "used") {
        resultEl.innerHTML = "❌ Já utilizado";
        resultEl.style.color = "red";
      } else {
        resultEl.innerHTML = "⚠️ Inválido";
        resultEl.style.color = "black";
      }

    } catch (err) {
      console.error(err);
      resultEl.innerHTML = "Erro ao validar";
    }
  }

  let scanning = true;

  function onScanSuccess(decodedText) {
    if (!scanning) return;

    scanning = false;
    validarQR(decodedText);

    setTimeout(() => scanning = true, 2000);
  }

  function startScanner() {
    const html5QrCode = new Html5Qrcode("reader");

    html5QrCode.start(
      { facingMode: "environment" }, // 🔥 força traseira
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },
      onScanSuccess
    ).catch(err => {
      console.error(err);
      resultEl.innerHTML = "Erro na câmara";
    });
  }

  navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => {
      stream.getTracks().forEach(track => track.stop());
      startScanner();
    })
    .catch(err => {
      console.error(err);
      resultEl.innerHTML = "❌ Permissão negada";
    });
</script>
