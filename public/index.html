<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Login</title>

<style>

body{

  margin:0;

  background:#f5f5f5;

  font-family:sans-serif;

  display:flex;

  justify-content:center;

  align-items:center;

  min-height:100vh;
}

.box{

  background:white;

  width:90%;
  max-width:420px;

  padding:40px;

  border-radius:20px;

  box-shadow:0 2px 15px rgba(0,0,0,0.1);

  text-align:center;
}

h1{

  margin-bottom:35px;

  font-size:34px;
}

input{

  width:100%;

  padding:16px;

  margin-top:15px;

  border:1px solid #ccc;

  border-radius:10px;

  font-size:18px;

  box-sizing:border-box;
}

button{

  width:100%;

  padding:16px;

  margin-top:20px;

  border:none;

  border-radius:10px;

  background:#1976d2;

  color:white;

  font-size:20px;

  cursor:pointer;
}

button:hover{

  opacity:0.9;
}

#error{

  margin-top:20px;

  color:red;

  font-size:18px;
}

</style>

</head>

<body>

<div class="box">

<h1>

🎟️ Ticket System

</h1>


<input
  type="text"
  id="username"
  placeholder="Utilizador"
>


<input
  type="password"
  id="password"
  placeholder="Código"
>


<button onclick="login()">

Entrar

</button>


<div id="error"></div>

</div>


<script>

async function login(){

  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;


  const res =
    await fetch("/login",{

      method:"POST",

      headers:{
        "Content-Type":
          "application/json"
      },

      body:JSON.stringify({

        username,
        password
      })
    });


  const data =
    await res.json();


  if(data.success){

    window.location =
      "/scanner.html";
  }

  else{

    document.getElementById("error")
    .innerHTML =

      "❌ Dados inválidos";
  }
}

</script>

</body>
</html>
