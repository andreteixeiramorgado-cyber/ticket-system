<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Ticket System</title>

<style>

body{

  margin:0;

  padding:30px;

  background:#f5f5f5;

  font-family:sans-serif;

  display:flex;

  justify-content:center;

  align-items:center;

  min-height:100vh;
}

.box{

  background:white;

  width:90%;
  max-width:450px;

  padding:40px;

  border-radius:20px;

  box-shadow:0 2px 15px rgba(0,0,0,0.1);

  text-align:center;
}

h1{

  margin-bottom:35px;

  font-size:34px;
}

input{

  width:100%;

  padding:16px;

  margin-top:15px;

  border:1px solid #ccc;

  border-radius:10px;

  font-size:18px;

  box-sizing:border-box;
}

button{

  width:100%;

  padding:18px;

  border:none;

  border-radius:12px;

  margin-top:15px;

  font-size:20px;

  cursor:pointer;

  color:white;

  transition:0.2s;
}

button:hover{

  opacity:0.9;
}

.scanner{

  background:#1976d2;
}

.activate{

  background:#f57c00;
}

.dashboard{

  background:#388e3c;
}

.admin{

  background:#d32f2f;
}

.logout{

  background:#222;
}

.hidden{

  display:none;
}

#error{

  margin-top:20px;

  color:red;

  font-size:18px;
}

</style>

</head>

<body>

<div class="box">

<h1>

🎟️ Ticket System

</h1>


<!-- LOGIN -->

<div id="loginBox">

<input
  type="text"
  id="username"
  placeholder="Utilizador"
>


<input
  type="password"
  id="password"
  placeholder="Código"
>


<button
class="scanner"
onclick="login()"
>

Entrar

</button>


<div id="error"></div>

</div>


<!-- MENU -->

<div
id="menu"
class="hidden"
>

<button
class="scanner"
onclick="window.location='/scanner.html'"
>

📷 Scanner

</button>


<button
class="activate"
onclick="window.location='/ativar.html'"
>

📦 Ativar Bilhetes

</button>


<button
class="dashboard"
onclick="window.location='/dashboard.html'"
>

📊 Dashboard

</button>


<button
class="admin"
onclick="window.location='/admin.html'"
>

⚙️ Administração

</button>


<button
class="logout"
onclick="logout()"
>

🚪 Logout

</button>

</div>

</div>


<script>

async function login(){

  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;


  const res =
    await fetch("/login",{

      method:"POST",

      headers:{
        "Content-Type":
          "application/json"
      },

      body:JSON.stringify({

        username,
        password
      })
    });


  const data =
    await res.json();


  if(data.success){

    document.getElementById("loginBox")
    .classList.add("hidden");

    document.getElementById("menu")
    .classList.remove("hidden");
  }

  else{

    document.getElementById("error")
    .innerHTML =

      "❌ Credenciais inválidas";
  }
}


function logout(){

  window.location =
    "/logout";
}

</script>

</body>
</html>
