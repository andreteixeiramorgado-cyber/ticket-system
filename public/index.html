<!DOCTYPE html>
<html>
<head>
  <title>Login Sistema</title>

  <style>

    body{
      font-family:sans-serif;
      background:#f5f5f5;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }

    .login-box{
      background:white;
      padding:40px;
      border-radius:16px;
      box-shadow:0 2px 15px rgba(0,0,0,0.1);
      width:320px;
      text-align:center;
    }

    h1{
      margin-bottom:30px;
    }

    input{
      width:100%;
      padding:14px;
      margin-top:10px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:16px;
      box-sizing:border-box;
    }

    button{
      width:100%;
      padding:15px;
      margin-top:15px;
      border:none;
      border-radius:10px;
      font-size:16px;
      cursor:pointer;
      transition:0.2s;
    }

    button:hover{
      opacity:0.9;
    }

    .scanner{
      background:#1976d2;
      color:white;
    }

    .ativar{
      background:#f57c00;
      color:white;
    }

    .admin{
      background:#333;
      color:white;
    }

  </style>
</head>

<body>

<div class="login-box">

  <h1>🎟️ Ticket System</h1>

  <input
    type="text"
    id="username"
    placeholder="Utilizador"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <!-- ====================================================== -->
  <!-- SCANNER -->
  <!-- ====================================================== -->

  <button
    class="scanner"
    onclick="login('scanner')">

    📷 Scanner

  </button>


  <!-- ====================================================== -->
  <!-- ATIVAR -->
  <!-- ====================================================== -->

  <button
    class="ativar"
    onclick="login('ativar')">

    📦 Ativar

  </button>


  <!-- ====================================================== -->
  <!-- ADMIN -->
  <!-- ====================================================== -->

  <button
    class="admin"
    onclick="adminLogin()">

    ⚙️ Administração

  </button>

</div>


<script>

// ======================================================
// LOGIN
// ======================================================

async function login(tipo){

  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;

  try{

    const res = await fetch("/login", {

      method: "POST",

      headers:{
        "Content-Type":"application/json"
      },

      body: JSON.stringify({
        username,
        password
      })
    });

    const data = await res.json();

    if(!data.success){

      alert("Login inválido");

      return;
    }


    // ======================================================
    // SCANNER
    // ======================================================

    if(tipo === "scanner"){

      window.location =
        "/scanner.html";
    }


    // ======================================================
    // ATIVAR
    // ======================================================

    if(tipo === "ativar"){

      window.location =
        "/ativar.html";
    }

  }

  catch(err){

    console.error(err);

    alert("Erro no login");
  }
}


// ======================================================
// ADMIN LOGIN EXTRA
// ======================================================

function adminLogin(){

  const key = prompt(
    "Password Administração"
  );

  if(key !== "admin2468"){

    alert("Password inválida");

    return;
  }

  window.location =
    "/admin.html";
}

</script>

</body>
</html>
