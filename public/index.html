<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Ticket System</title>

<style>

body{

  margin:0;

  padding:30px;

  background:#f5f5f5;

  font-family:sans-serif;

  display:flex;

  justify-content:center;

  align-items:center;

  min-height:100vh;
}

.box{

  background:white;

  width:90%;
  max-width:450px;

  padding:40px;

  border-radius:20px;

  box-shadow:0 2px 15px rgba(0,0,0,0.1);

  text-align:center;
}

h1{

  margin-bottom:35px;

  font-size:34px;
}

button{

  width:100%;

  padding:18px;

  border:none;

  border-radius:12px;

  margin-top:15px;

  font-size:20px;

  cursor:pointer;

  color:white;

  transition:0.2s;
}

button:hover{

  opacity:0.9;
}

.scanner{

  background:#1976d2;
}

.activate{

  background:#f57c00;
}

.admin{

  background:#d32f2f;
}

.logout{

  background:#222;
}

</style>

</head>

<body>

<div class="box">

<h1>

🎟️ Ticket System

</h1>


<button
class="scanner"
onclick="window.location='/scanner.html'"
>

📷 Scanner

</button>


<button
class="activate"
onclick="window.location='/ativar.html'"
>

📦 Ativar Bilhetes

</button>


<button
class="admin"
onclick="window.location='/admin.html'"
>

⚙️ Administração

</button>


<button
class="logout"
onclick="window.location='/logout'"
>

🚪 Logout

</button>

</div>

</body>
</html>
