<!DOCTYPE html>
<html>
<body style="text-align:center;font-family:sans-serif;background:#111;color:white;">

  <h1>🎟️ Bilhete</h1>
  <h2 id="status">A verificar...</h2>
  <p id="code"></p>

  <script>
    const id = window.location.pathname.split("/t/")[1];

    document.getElementById("code").innerText = id;

    async function check() {
      const res = await fetch("/api/status/" + id);
      const data = await res.json();

      const el = document.getElementById("status");
if(data.status === "active"){

  if(data.limite){

    el.innerHTML =

      "🟢 Bilhete Ativo<br><br>" +

      data.usados +

      " / " +

      data.limite +

      " refeições utilizadas";
  }

  else{

    el.innerHTML =

      "🟢 Bilhete Ativo";
  }

  el.style.color = "lime";
}

else if(
  data.status === "not_active"
){

  el.innerText =

    "⚪ Bilhete não ativado";

  el.style.color =
    "orange";
}

else{

  el.innerText =

    "⚠️ Bilhete inválido";

  el.style.color =
    "red";
}
    }

    check();
  </script>

</body>
</html>
