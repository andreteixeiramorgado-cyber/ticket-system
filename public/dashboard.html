<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Dashboard</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

padding:30px;

background:#f4f6f9;

font-family:Arial,Helvetica,sans-serif;

color:#222;

}

h1{

margin:0 0 30px;

text-align:center;

font-size:34px;

}

.section{

margin-top:45px;

}

.section h2{

margin-bottom:20px;

padding-bottom:10px;

border-bottom:3px solid #ddd;

font-size:28px;

}

.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-bottom:35px;

}

.card{

background:#fff;

border-radius:14px;

padding:20px;

box-shadow:

0 3px 12px rgba(0,0,0,.12);

}

.card h3{

margin:0;

font-size:18px;

}

.value{

margin-top:20px;

font-size:38px;

font-weight:bold;

}

.subtitle{

margin-top:8px;

font-size:17px;

color:#666;

}

.evt{

border-left:8px solid #1976d2;

}

.rsc{

border-left:8px solid #2e7d32;

}

.vip{

border-left:8px solid #ef6c00;

}

.boss{

border-left:8px solid #8e24aa;

}

.cal{

border-left:8px solid #d32f2f;

}

.resume{

background:#fff;

padding:20px;

border-radius:12px;

box-shadow:

0 2px 8px rgba(0,0,0,.1);

margin-bottom:20px;

font-size:18px;

line-height:32px;

}

table{

width:100%;

border-collapse:collapse;

background:#fff;

box-shadow:

0 2px 8px rgba(0,0,0,.08);

margin-bottom:45px;

}

th{

background:#222;

color:white;

padding:12px;

}

td{

padding:10px;

border:1px solid #ddd;

text-align:center;

}

tr:nth-child(even){

background:#fafafa;

}

tfoot{

font-weight:bold;

background:#ececec;

}

button{

width:100%;

margin-top:30px;

padding:16px;

font-size:20px;

border:none;

border-radius:10px;

background:#222;

color:white;

cursor:pointer;

}

button:hover{

background:#000;

}

@media(max-width:900px){

.cards{

grid-template-columns:1fr;

}

}

</style>

</head>

<script>

  async function loadDashboard(){

  try{

    const res =
      await fetch("/api/dashboard");

    const data =
      await res.json();

    renderCards(data);

    renderEVT(data);

    renderRSC(data);

    renderVIP(data);

    renderCAL(data);

    renderODS(data);

    renderResumo(data);

  }

  catch(err){

    console.error(err);

  }

}

// CARTÕES
// ===========================================

function renderCards(data){

  document.getElementById(
    "evtVendidos"
  ).innerHTML =
    data.evtVendidos;

  document.getElementById(
    "evtEntradas"
  ).innerHTML =
    "Entradas: " +
    data.evtEntradas;



  document.getElementById(
    "rscAtivados"
  ).innerHTML =
    data.rscAtivados;

  document.getElementById(
    "rscEntradas"
  ).innerHTML =
    "Entradas: " +
    data.rscEntradas;



  document.getElementById(
    "promAtivados"
  ).innerHTML =
    data.promAtivados;

  document.getElementById(
    "promEntradas"
  ).innerHTML =
    "Entradas: " +
    data.promEntradas;



  document.getElementById(
    "bossAtivados"
  ).innerHTML =
    data.bossAtivados;

  document.getElementById(
    "bossEntradas"
  ).innerHTML =
    "Entradas: " +
    data.bossEntradas;



  document.getElementById(
    "calAtivados"
  ).innerHTML =
    data.calTotais.ativados;

  document.getElementById(
    "calEntradas"
  ).innerHTML =
    "Entradas: " +

    (

      data.calTotais.a1 +

      data.calTotais.j1 +

      data.calTotais.a2 +

      data.calTotais.j2 +

      data.calTotais.a3

    );

}
