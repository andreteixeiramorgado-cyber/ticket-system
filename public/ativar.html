<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Ativar Bilhetes</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{

  margin:0;

  background:#f5f5f5;

  font-family:sans-serif;

  display:flex;

  justify-content:center;

  align-items:center;

  min-height:100vh;
}

.box{

  background:white;

  width:90%;
  max-width:450px;

  padding:35px;

  border-radius:20px;

  box-shadow:0 2px 15px rgba(0,0,0,0.1);

  text-align:center;
}

#reader{

  width:100%;
}

h1{

  margin-bottom:25px;
}

button{

  width:100%;

  padding:15px;

  border:none;

  border-radius:10px;

  margin-top:15px;

  font-size:18px;

  cursor:pointer;

  color:white;
}

.orange{

  background:#f57c00;
}

.dark{

  background:#222;
}

#result{

  margin-top:25px;

  font-size:28px;

  font-weight:bold;
}

#clienteBox{

  margin-bottom:20px;

  font-size:20px;

  font-weight:bold;
}

</style>

</head>

<body>

<div class="box">

<h1>

📦 Ativar Bilhetes

</h1>

<div id="clienteBox"></div>

<div id="reader"></div>

<div id="result">

Aguardando QR...

</div>


<button
class="orange"
onclick="window.location='/scanner.html'"
>

📷 Ir para Scanner

</button>


<button
class="dark"
onclick="window.location='/'"
>

⬅️ Voltar Início

</button>

</div>


<script>

// ======================================================
// CLIENTE
// ======================================================

const cliente = prompt(

  "Nome do Cliente"
);

if(!cliente){

  alert("Cliente obrigatório");

  window.location = "/";
}


const refeicoes = prompt(

  "Número de refeições (1 a 8)",

  "1"
);

if(

  !refeicoes ||

  isNaN(refeicoes) ||

  Number(refeicoes) < 1 ||

  Number(refeicoes) > 8

){

  alert(

    "Número de refeições inválido"
  );

  window.location = "/";
}


document.getElementById("clienteBox")
.innerHTML =

"👤 Cliente: " +

cliente +

"<br>🍽️ Refeições: " +

refeicoes;


// ======================================================
// VARS
// ======================================================

const resultEl =
  document.getElementById("result");

let scanning = true;


// ======================================================
// ATIVAR
// ======================================================

async function ativarQR(texto){

  try{

   let id;

if (texto.includes("/t/")) {

    id = texto.split("/t/")[1];

} else {

    id = texto.trim();

}

    if(!id){

      resultEl.innerHTML =
        "⚠️ QR inválido";

      resultEl.style.color =
        "red";

      return;
    }

    const res =
      await fetch(

        "/api/activate/" +

        id +

        "?cliente=" +

        encodeURIComponent(cliente) +

        "&refeicoes=" +

        refeicoes
      );

    const data =
      await res.json();


    if(data.status === "activated"){

      resultEl.innerHTML =

        "✅ Bilhete Ativado";

      resultEl.style.color =
        "green";
    }


      else if(
  data.status === "already_active"
){

  resultEl.innerHTML =

    "⚠️ Bilhete já ativado";

  resultEl.style.color =
    "orange";
}
        
    else{

      resultEl.innerHTML =
        "❌ Erro";

      resultEl.style.color =
        "red";
    }


    scanning = false;


    setTimeout(()=>{

      resultEl.innerHTML =

        "📦 Ler novo bilhete";

      resultEl.style.color =
        "black";

    },1000);


    setTimeout(()=>{

      scanning = true;

      resultEl.innerHTML =

        "Aguardando QR...";

      resultEl.style.color =
        "black";

    },3000);

  }

  catch(err){

    console.error(err);

    resultEl.innerHTML =
      "Erro interno";

    resultEl.style.color =
      "red";
  }
}


// ======================================================
// SCAN
// ======================================================

function onScanSuccess(decodedText){

  if(!scanning) return;

  scanning = false;

  ativarQR(decodedText);
}


// ======================================================
// START
// ======================================================

function startScanner(){

  const html5QrCode =

    new Html5Qrcode("reader");

  html5QrCode.start(

    { facingMode:"environment" },

    {

      fps:10,

      qrbox:{

        width:250,
        height:250
      }
    },

    onScanSuccess

  )

  .catch(err=>{

    console.error(err);

    resultEl.innerHTML =
      "Erro câmara";
  });
}


// ======================================================
// CAMERA
// ======================================================

navigator.mediaDevices

.getUserMedia({

  video:true
})

.then(stream=>{

  stream.getTracks()
  .forEach(track=>track.stop());

  startScanner();
})

.catch(err=>{

  console.error(err);

  resultEl.innerHTML =
    "Permissão negada";
});

</script>

</body>
</html>
