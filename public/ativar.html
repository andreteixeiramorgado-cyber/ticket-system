<!DOCTYPE html>
<html>
<head>
  <title>Ativar Bilhete</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body style="text-align:center;font-family:sans-serif;">
  <h2>📦 Ativação de Bilhetes</h2>

  <div id="reader" style="width:300px;margin:auto;"></div>
  <h1 id="result">Aguardando scan...</h1>

  <script>
  async function ativarQR(texto) {
    try {
      const id = texto.split("/t/")[1];
      const nome = document.getElementById("nome").value;

      if (!id) {
        document.getElementById("result").innerHTML = "QR inválido";
        return;
      }

      const res = await fetch("/api/activate/" + id, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ nome })
      });

      const data = await res.json();

      if (data.status === "activated") {
        document.getElementById("result").innerHTML = "🟡 Ativado: " + nome;
      } else {
        document.getElementById("result").innerHTML = "Erro";
      }

    } catch (err) {
      console.error(err);
      document.getElementById("result").innerHTML = "Erro ao ativar";
    }
  }
</script>

</body>
</html>
