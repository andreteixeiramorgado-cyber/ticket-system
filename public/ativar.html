<!DOCTYPE html>
<html>
<head>
  <title>Ativar Bilhete</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body{
      text-align:center;
      font-family:sans-serif;
      background:#f5f5f5;
      margin:0;
      padding:30px;
    }

    h2{
      margin-bottom:20px;
    }

    #reader{
      width:320px;
      margin:auto;
      border-radius:12px;
      overflow:hidden;
    }

    #result{
      margin-top:25px;
      font-size:32px;
      font-weight:bold;
      min-height:80px;
    }

    .info{
      margin-top:10px;
      font-size:18px;
      color:#666;
    }

    .nav-btn{
      margin-top:20px;
      padding:14px 25px;
      border:none;
      border-radius:10px;
      background:#1976d2;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

  </style>
</head>

<body>

<h2>📦 Ativação de Bilhetes</h2>

<div id="reader"></div>

<h1 id="result">
  Aguardando scan...
</h1>

<div class="info">
  Sistema de ativação ativo
</div>

<button
  class="nav-btn"
  onclick="window.location='/scanner.html'">

  📷 Ir para Scanner

</button>

<script>

const resultEl =
  document.getElementById("result");

let scanning = true;


// ======================================================
// ATIVAR
// ======================================================

async function ativarQR(texto){

  try{

    const id = texto.split("/t/")[1];

    if(!id){

      resultEl.innerHTML =
        "⚠️ QR inválido";

      resultEl.style.color = "black";

      return;
    }

    const res =
      await fetch("/api/activate/" + id);

    const data = await res.json();


    // ======================================================
    // ATIVADO
    // ======================================================

    if(data.status === "activated"){

      resultEl.innerHTML =
        "🟡 Bilhete ativado";

      resultEl.style.color = "orange";
    }


    // ======================================================
    // INVÁLIDO
    // ======================================================

    else{

      resultEl.innerHTML =
        "⚠️ Bilhete inválido";

      resultEl.style.color = "red";
    }


    // ======================================================
    // 3 SEGUNDOS
    // ======================================================

    setTimeout(() => {

      scanning = true;

      resultEl.innerHTML =
        "📦 Ler novo bilhete";

      resultEl.style.color = "black";

    }, 3000);

  }

  catch(err){

    console.error(err);

    resultEl.innerHTML =
      "Erro ao ativar";

    resultEl.style.color = "red";

    scanning = true;
  }
}


// ======================================================
// SCAN SUCCESS
// ======================================================

function onScanSuccess(decodedText){

  if(!scanning) return;

  scanning = false;

  ativarQR(decodedText);
}


// ======================================================
// START CAMERA
// ======================================================

function startScanner(){

  const html5QrCode =
    new Html5Qrcode("reader");

  html5QrCode.start(

    { facingMode: "environment" },

    {
      fps: 10,

      qrbox:{
        width:260,
        height:260
      }
    },

    onScanSuccess

  ).catch(err => {

    console.error(err);

    resultEl.innerHTML =
      "Erro ao abrir câmara";
  });
}


// ======================================================
// CAMERA PERMISSION
// ======================================================

navigator.mediaDevices.getUserMedia({
  video:true
})

.then(stream => {

  stream.getTracks().forEach(track =>
    track.stop()
  );

  startScanner();
})

.catch(err => {

  console.error(err);

  resultEl.innerHTML =
    "Permissão de câmara negada";
});

</script>

</body>
</html>
